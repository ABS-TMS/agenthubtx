<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Site Map | AgentHubTX</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root {
    --navy: #0C3057; --gold: #C8922A; --white: #ffffff; --off: #F7F6F3;
    --gray-300: #C8C5BC; --gray-500: #888780; --gray-700: #444441;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; background: var(--off); color: var(--gray-700); line-height: 1.5; }

  header { background: var(--navy); border-bottom: 3px solid var(--gold); padding: 24px; }
  .header-inner { max-width: 960px; margin: 0 auto; }
  .brand { color: #fff; font-size: 16px; font-weight: 700; margin-bottom: 6px; }
  .brand span { color: var(--gold); }
  h1 { color: #fff; font-size: 21px; }
  .subtitle { color: var(--gray-300); font-size: 13px; margin-top: 6px; }
  .back-link { display: inline-block; margin-top: 10px; margin-right: 16px; font-size: 12.5px; color: var(--gray-300); text-decoration: none; }
  .back-link:hover { color: #fff; }

  .wrap { max-width: 960px; margin: 0 auto; padding: 26px 20px 60px; }

  .search-box { width: 100%; padding: 12px 16px; border: 1.5px solid #E5E3DA; border-radius: 8px; font-size: 14px; margin-bottom: 28px; background: var(--white); }
  .search-box:focus { outline: none; border-color: var(--gold); }

  h2.category { color: var(--navy); font-size: 16px; margin: 28px 0 10px; padding-bottom: 6px; border-bottom: 2px solid var(--gold); }
  h2.category:first-of-type { margin-top: 0; }

  .page-grid { display: grid; grid-template-columns: 1fr; gap: 8px; }
  .page-card { background: var(--white); border: 1px solid #E5E3DA; border-left: 3px solid var(--gold); border-radius: 6px; padding: 12px 14px; text-decoration: none; display: block; }
  .page-card:hover { border-left-color: var(--navy); background: #FBFAF7; }
  .page-title { font-size: 14px; font-weight: 700; color: var(--navy); margin-bottom: 3px; }
  .page-desc { font-size: 12.5px; color: var(--gray-500); }

  .no-results { text-align: center; padding: 50px 20px; color: var(--gray-500); font-size: 14px; }
  #loadingState { text-align: center; padding: 60px 20px; color: var(--gray-500); }
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <div class="brand">Agent<span>HubTX</span></div>
    <h1>Site Map</h1>
    <div class="subtitle">Every page on AgentHubTX, grouped and searchable — a reference for the team, not the agent-facing directory.</div>
    <a class="back-link" href="dashboard.html">&larr; Back to Hub</a>
    <a class="back-link" href="site-map-admin.html">Reorganize / Add Pages &rarr;</a>
  </div>
</header>

<div class="wrap">
  <div id="loadingState">Loading...</div>
  <div id="content" style="display:none;">
    <input type="text" class="search-box" id="search" placeholder="Search pages — e.g. &quot;checklist&quot; or &quot;community&quot;" oninput="renderPages()">
    <div id="results"></div>
  </div>
</div>

<script>
const SUPABASE_URL = 'https://tjdxnmukjraljvjprolk.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_ZeQUPnpkiJvLGw-v-Dw9Mw_FilZ1eP5';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let PAGES = [];

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str || '';
  return div.innerHTML;
}

async function loadPages() {
  const { data, error } = await sb.rpc('get_site_map_pages');
  if (error) {
    document.getElementById('loadingState').textContent = 'Could not load the site map. Try refreshing.';
    return;
  }
  PAGES = data || [];
  document.getElementById('loadingState').style.display = 'none';
  document.getElementById('content').style.display = 'block';
  renderPages();
}

function renderPages() {
  const query = document.getElementById('search').value.trim().toLowerCase();
  const resultsEl = document.getElementById('results');

  const filtered = PAGES.filter(p => {
    const haystack = (p.title + ' ' + (p.description || '') + ' ' + p.category).toLowerCase();
    return !query || haystack.includes(query);
  });

  if (filtered.length === 0) {
    resultsEl.innerHTML = '<div class="no-results">No pages match that search.</div>';
    return;
  }

  const grouped = {};
  filtered.forEach(p => {
    if (!grouped[p.category]) grouped[p.category] = [];
    grouped[p.category].push(p);
  });

  const orderedCats = [...new Set(filtered.map(p => p.category))];

  resultsEl.innerHTML = orderedCats.map(cat => `
    <h2 class="category">${escapeHtml(cat)}</h2>
    <div class="page-grid">
      ${grouped[cat].map(p => `
        <a class="page-card" href="${escapeHtml(p.url)}">
          <div class="page-title">${escapeHtml(p.title)}</div>
          <div class="page-desc">${escapeHtml(p.description || p.url)}</div>
        </a>
      `).join('')}
    </div>
  `).join('');
}

loadPages();
</script>

</body>
</html>
