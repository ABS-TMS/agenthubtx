<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reorganize Tools | AgentHubTX</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root {
    --navy: #0C3057; --gold: #C8922A; --white: #ffffff; --off: #F7F6F3;
    --gray-300: #C8C5BC; --gray-500: #888780; --gray-700: #444441;
    --teal: #0F6E56; --teal-light: #E1F5EE;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; background: var(--off); color: var(--gray-700); }
  input, button { font-family: inherit; }

  header { background: var(--navy); border-bottom: 3px solid var(--gold); padding: 18px 24px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
  .brand { font-size: 15px; font-weight: 700; color: #fff; }
  .brand span { color: var(--gold); }
  .back-link { font-size: 12.5px; color: var(--gray-300); text-decoration: none; }
  .back-link:hover { color: #fff; }

  #loadingState, #deniedState { text-align: center; padding: 80px 20px; color: var(--gray-500); }

  .toolbar { padding: 14px 20px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .toolbar input { padding: 8px 12px; border-radius: 7px; border: 1px solid var(--gray-300); font-size: 13px; width: 220px; }
  .toolbar button { padding: 8px 16px; border-radius: 7px; border: none; background: var(--gold); color: var(--navy); font-weight: 700; font-size: 13px; cursor: pointer; }
  .save-status { font-size: 12px; color: var(--teal); margin-left: 8px; opacity: 0; transition: opacity 0.3s; }
  .save-status.show { opacity: 1; }

  .board { display: flex; gap: 14px; padding: 0 20px 40px; overflow-x: auto; align-items: flex-start; }
  .column { background: var(--white); border: 1px solid #E5E3DA; border-radius: 10px; min-width: 250px; max-width: 250px; flex-shrink: 0; }
  .column-header { padding: 12px 14px; font-size: 12.5px; font-weight: 700; color: var(--navy); text-transform: uppercase; letter-spacing: 0.03em; border-bottom: 2px solid var(--gold); display: flex; justify-content: space-between; align-items: center; }
  .column-count { font-size: 11px; color: var(--gray-500); font-weight: 400; text-transform: none; }
  .rename-cat-btn { background: none; border: none; color: var(--gray-500); font-size: 12px; cursor: pointer; padding: 0 0 0 8px; margin-left: auto; }
  .rename-cat-btn:hover { color: var(--navy); }
  .delete-cat-btn { background: none; border: none; color: var(--gray-500); font-size: 13px; cursor: pointer; padding: 0 0 0 6px; }
  .delete-cat-btn:hover { color: #A32D2D; }
  .column-body { padding: 10px; min-height: 60px; }
  .column.drag-over .column-body { background: var(--teal-light); border-radius: 0 0 8px 8px; }

  .card { background: var(--off); border: 1px solid #E5E3DA; border-radius: 7px; padding: 10px 12px; margin-bottom: 8px; cursor: grab; font-size: 12.5px; }
  .card.dragging { opacity: 0.35; }
  .card:active { cursor: grabbing; }
  .card-title { font-weight: 600; color: var(--navy); margin-bottom: 3px; }
  .card-desc { font-size: 11px; color: var(--gray-500); overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .drop-indicator { height: 3px; background: var(--gold); border-radius: 2px; margin: 2px 0; }
</style>
</head>
<body>

<header>
  <div class="brand">Agent<span>HubTX</span> · Reorganize Tools</div>
  <a class="back-link" href="tools-directory.html">&larr; Back to Tools Directory</a>
</header>

<div id="loadingState"><p>Loading...</p></div>
<div id="deniedState" style="display:none;">
  <h2 style="color:var(--navy); margin-bottom:10px;">Not authorized</h2>
  <p>This page is limited to the broker account.</p>
</div>

<div id="app" style="display:none;">
  <div class="toolbar">
    <input type="text" id="newCategoryInput" placeholder="New category name...">
    <button onclick="addCategory()">Add Category</button>
    <button onclick="toggleAddToolForm()" id="addToolToggleBtn">+ Add Tool</button>
    <span class="save-status" id="saveStatus">Saved</span>
  </div>
  <div id="addToolForm" style="display:none; padding: 0 20px 18px; max-width: 480px;">
    <div style="background:#fff; border:1px solid #E5E3DA; border-radius:10px; padding:16px; display:flex; flex-direction:column; gap:10px;">
      <input type="text" id="newToolTitle" placeholder="Title (e.g. Buyer Intake)" style="padding:9px 12px; border-radius:7px; border:1px solid var(--gray-300); font-size:13px;">
      <textarea id="newToolDesc" placeholder="Short description" rows="2" style="padding:9px 12px; border-radius:7px; border:1px solid var(--gray-300); font-size:13px; resize:vertical;"></textarea>
      <input type="text" id="newToolUrl" placeholder="URL (e.g. buyer-intake.html)" style="padding:9px 12px; border-radius:7px; border:1px solid var(--gray-300); font-size:13px;">
      <input type="text" id="newToolGuideUrl" placeholder="Guide URL (optional)" style="padding:9px 12px; border-radius:7px; border:1px solid var(--gray-300); font-size:13px;">
      <select id="newToolCategory" style="padding:9px 12px; border-radius:7px; border:1px solid var(--gray-300); font-size:13px;"></select>
      <div style="display:flex; gap:8px;">
        <button onclick="submitAddTool()" style="padding:9px 16px; border-radius:7px; border:none; background:var(--gold); color:var(--navy); font-weight:700; font-size:13px; cursor:pointer;">Add Tool</button>
        <button onclick="toggleAddToolForm()" style="padding:9px 16px; border-radius:7px; border:1px solid var(--gray-300); background:#fff; color:var(--gray-700); font-weight:600; font-size:13px; cursor:pointer;">Cancel</button>
      </div>
    </div>
  </div>
  <div class="board" id="board"></div>
</div>

<div id="scrollSliderWrap" style="display:none; padding: 0 20px 14px;">
  <input type="range" id="scrollSlider" min="0" max="100" value="0" style="width:100%;">
</div>

<script>
const SUPABASE_URL = 'https://tjdxnmukjraljvjprolk.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_ZeQUPnpkiJvLGw-v-Dw9Mw_FilZ1eP5';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const ADMIN_EMAIL = 'mike@urocketrealty.com';

let tools = [];
let categoryOrder = [];
let draggedId = null;

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str || '';
  return div.innerHTML;
}

async function init() {
  const { data: { session } } = await sb.auth.getSession();
  if (!session || session.user.email !== ADMIN_EMAIL) {
    document.getElementById('loadingState').style.display = 'none';
    document.getElementById('deniedState').style.display = 'block';
    return;
  }

  const { data, error } = await sb.rpc('get_tools');
  if (error) {
    document.getElementById('loadingState').innerHTML = '<p>Could not load tools. Refresh to try again.</p>';
    return;
  }
  tools = data || [];

  const { data: catData, error: catError } = await sb
    .from('tool_categories')
    .select('name')
    .order('sort_order');
  if (catError) {
    document.getElementById('loadingState').innerHTML = '<p>Could not load categories. Refresh to try again.</p>';
    return;
  }
  categoryOrder = (catData || []).map(c => c.name);
  // Safety net: include any category a tool has that's somehow missing from the table
  tools.forEach(t => { if (!categoryOrder.includes(t.category)) categoryOrder.push(t.category); });

  document.getElementById('loadingState').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  render();
  setupScrollSlider();
}

function setupScrollSlider() {
  const board = document.getElementById('board');
  const slider = document.getElementById('scrollSlider');
  const wrap = document.getElementById('scrollSliderWrap');

  function maybeShowSlider() {
    const overflowing = board.scrollWidth > board.clientWidth + 4;
    wrap.style.display = overflowing ? 'block' : 'none';
  }

  slider.addEventListener('input', () => {
    const maxScroll = board.scrollWidth - board.clientWidth;
    board.scrollLeft = (slider.value / 100) * maxScroll;
  });

  board.addEventListener('scroll', () => {
    const maxScroll = board.scrollWidth - board.clientWidth;
    slider.value = maxScroll > 0 ? (board.scrollLeft / maxScroll) * 100 : 0;
  });

  maybeShowSlider();
  window.addEventListener('resize', maybeShowSlider);
  new MutationObserver(maybeShowSlider).observe(board, { childList: true, subtree: true });
}

async function addCategory() {
  const input = document.getElementById('newCategoryInput');
  const name = input.value.trim();
  if (!name || categoryOrder.includes(name)) return;

  try {
    const { error } = await sb.rpc('admin_add_category', { p_name: name });
    if (error) throw error;
    categoryOrder.push(name);
    input.value = '';
    render();
  } catch (err) {
    console.error('Could not add category:', err);
    alert('Could not save that category. Refresh and try again.');
  }
}

function toggleAddToolForm() {
  const form = document.getElementById('addToolForm');
  const showing = form.style.display !== 'none';
  if (showing) {
    form.style.display = 'none';
  } else {
    document.getElementById('newToolTitle').value = '';
    document.getElementById('newToolDesc').value = '';
    document.getElementById('newToolUrl').value = '';
    document.getElementById('newToolGuideUrl').value = '';
    const catSelect = document.getElementById('newToolCategory');
    catSelect.innerHTML = categoryOrder.map(c => `<option value="${escapeHtml(c)}">${escapeHtml(c)}</option>`).join('');
    form.style.display = 'block';
  }
}

async function submitAddTool() {
  const title = document.getElementById('newToolTitle').value.trim();
  const description = document.getElementById('newToolDesc').value.trim();
  const url = document.getElementById('newToolUrl').value.trim();
  const guideUrl = document.getElementById('newToolGuideUrl').value.trim();
  const category = document.getElementById('newToolCategory').value;

  if (!title || !url) {
    alert('Title and URL are required.');
    return;
  }

  const itemsInCategory = tools.filter(t => t.category === category);
  const sortOrder = (Math.max(0, ...itemsInCategory.map(t => t.sort_order)) || 0) + 10;

  try {
    const { data, error } = await sb.rpc('admin_add_tool', {
      p_title: title,
      p_description: description || null,
      p_url: url,
      p_category: category,
      p_guide_url: guideUrl || null,
      p_sort_order: sortOrder,
    });
    if (error) throw error;
    const newId = Array.isArray(data) ? data[0]?.id : data;
    tools.push({ id: newId, title, description, url, category, guide_url: guideUrl || null, sort_order: sortOrder });
    toggleAddToolForm();
    render();
  } catch (err) {
    console.error('Could not add tool:', err);
    alert('Could not save that tool. Refresh and try again.');
  }
}

async function deleteTool(id, title) {
  if (!confirm(`Delete "${title}"? This can't be undone.`)) return;

  try {
    const { error } = await sb.rpc('admin_delete_tool', { p_id: id });
    if (error) throw error;
    tools = tools.filter(t => t.id !== id);
    render();
  } catch (err) {
    console.error('Could not delete tool:', err);
    alert('Could not delete that tool. Refresh and try again.');
  }
}

function render() {
  const board = document.getElementById('board');
  board.innerHTML = categoryOrder.map(cat => {
    const items = tools.filter(t => t.category === cat).sort((a, b) => a.sort_order - b.sort_order);
    return `
      <div class="column" data-category="${escapeHtml(cat)}"
           ondragover="onColumnDragOver(event)" ondragleave="onColumnDragLeave(event)" ondrop="onColumnDrop(event, '${escapeHtml(cat)}')">
        <div class="column-header">${escapeHtml(cat)} <span class="column-count">${items.length}</span><button class="rename-cat-btn" onclick="renameCategory('${escapeHtml(cat)}')" title="Rename category">✎</button>${cat !== 'General' ? `<button class="delete-cat-btn" onclick="deleteCategory('${escapeHtml(cat)}')" title="Delete category">✕</button>` : ''}</div>
        <div class="column-body">
          ${items.map(t => `
            <div class="card" draggable="true" data-id="${t.id}"
                 ondragstart="onDragStart(event, '${t.id}')" ondragend="onDragEnd(event)">
              <div style="display:flex; justify-content:space-between; align-items:flex-start; gap:6px;">
                <div class="card-title">${escapeHtml(t.title)}</div>
                <button class="delete-cat-btn" onclick="deleteTool('${t.id}', '${escapeHtml(t.title).replace(/'/g, "\\'")}')" title="Delete this tool" style="flex-shrink:0;">✕</button>
              </div>
              <div class="card-desc">${escapeHtml(t.description || '')}</div>
            </div>`).join('')}
        </div>
      </div>`;
  }).join('');
}

function onDragStart(e, id) {
  draggedId = id;
  e.target.classList.add('dragging');
  e.dataTransfer.effectAllowed = 'move';
}
function onDragEnd(e) {
  e.target.classList.remove('dragging');
}
function onColumnDragOver(e) {
  e.preventDefault();
  e.currentTarget.classList.add('drag-over');
}
function onColumnDragLeave(e) {
  e.currentTarget.classList.remove('drag-over');
}

async function onColumnDrop(e, newCategory) {
  e.preventDefault();
  e.currentTarget.classList.remove('drag-over');
  if (!draggedId) return;

  const tool = tools.find(t => t.id === draggedId);
  if (!tool) return;

  tool.category = newCategory;
  const itemsInCategory = tools.filter(t => t.category === newCategory);
  tool.sort_order = (Math.max(0, ...itemsInCategory.map(t => t.sort_order)) || 0) + 10;

  render();
  await saveTool(tool);
  draggedId = null;
}

async function renameCategory(oldName) {
  const newName = prompt(`Rename "${oldName}" to:`, oldName);
  if (!newName || !newName.trim() || newName.trim() === oldName) return;
  const trimmed = newName.trim();

  if (categoryOrder.includes(trimmed)) {
    alert(`"${trimmed}" already exists — merge tools by dragging them there instead, or pick a different name.`);
    return;
  }

  try {
    const { error } = await sb.rpc('admin_rename_category', { p_old_name: oldName, p_new_name: trimmed });
    if (error) throw error;
    tools.filter(t => t.category === oldName).forEach(t => { t.category = trimmed; });
    categoryOrder = categoryOrder.map(c => c === oldName ? trimmed : c);
    render();
  } catch (err) {
    console.error('Could not rename category:', err);
    alert('Could not save that rename. Refresh and try again.');
  }
}

async function deleteCategory(cat) {
  const items = tools.filter(t => t.category === cat);
  const msg = items.length
    ? `Delete "${cat}"? ${items.length} tool(s) will move to General.`
    : `Delete empty category "${cat}"?`;
  if (!confirm(msg)) return;

  try {
    const { error } = await sb.rpc('admin_delete_category', { p_name: cat });
    if (error) throw error;

    if (!categoryOrder.includes('General')) categoryOrder.push('General');
    items.forEach(t => { t.category = 'General'; });
    categoryOrder = categoryOrder.filter(c => c !== cat);
    render();
  } catch (err) {
    console.error('Could not delete category:', err);
    alert('Could not save that deletion. Refresh and try again.');
  }
}

async function saveTool(tool) {
  try {
    const { error } = await sb.rpc('admin_update_tool_placement', {
      p_id: tool.id,
      p_category: tool.category,
      p_sort_order: tool.sort_order,
    });
    if (error) throw error;
    const status = document.getElementById('saveStatus');
    status.classList.add('show');
    setTimeout(() => status.classList.remove('show'), 1500);
  } catch (err) {
    console.error('Save failed:', err);
    alert('Could not save that change. Refresh and try again.');
  }
}

init();
</script>
</body>
</html>
